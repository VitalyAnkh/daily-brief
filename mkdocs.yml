site_name: 每日阅读早报
site_description: 写给虚宝的每日阅读早报：爆文、深度文章、书、人物、反面观点与公众号选题。
site_author: VitalyAnkh
site_url: https://brief.vitalyr.com/
repo_url: https://github.com/VitalyAnkh/daily-brief
repo_name: VitalyAnkh/daily-brief
edit_uri: edit/main/docs/
copyright: 每日阅读早报 · 为虚宝而写

theme:
  name: material
  language: zh
  font: false            # 不加载 Google Fonts（国内访问不稳），改用系统中文字体
  icon:
    logo: material/book-open-page-variant
  palette:
    - media: "(prefers-color-scheme)"
      toggle:
        icon: material/brightness-auto
        name: 跟随系统
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: brown
      accent: deep orange
      toggle:
        icon: material/brightness-7
        name: 切换到深色
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: brown
      accent: deep orange
      toggle:
        icon: material/brightness-4
        name: 跟随系统
  features:
    - navigation.instant
    - navigation.instant.progress
    - navigation.tracking
    - navigation.top
    - navigation.footer
    - navigation.indexes
    - search.suggest
    - search.highlight
    - toc.follow
    - content.action.view

plugins:
  - search:
      # jieba 在构建时为中文分词（以 \u200b 连接），分隔符里需包含 \u200b
      separator: '[\s\u200b\-_,:!=\[\]()"`/]+|\.(?!\d)|&[lg]t;|(?=[A-Z][a-z])'
  - rss:
      match_path: "issues/.*"
      use_git: false
      date_from_meta:
        as_creation: date
        as_update: date
        datetime_format: "%Y-%m-%d"
        default_timezone: Asia/Shanghai
        default_time: "08:00"
      abstract_chars_count: 240
      length: 30
      feed_title: 每日阅读早报
      feed_description: 写给虚宝的每日阅读早报
      pretty_print: false

hooks:
  - hooks/issues.py

extra:
  generator: false
  social:
    - icon: material/rss
      link: https://brief.vitalyr.com/feed_rss_created.xml
      name: RSS 订阅

extra_css:
  - assets/katex/katex.min.css
  - stylesheets/extra.css

extra_javascript:
  - javascripts/katex.js
  - assets/katex/katex.min.js
  - assets/katex/contrib/auto-render.min.js

markdown_extensions:
  - abbr
  - admonition
  - attr_list
  - footnotes
  - md_in_html
  - tables
  - toc:
      permalink: "¶"
      slugify: !!python/object/apply:pymdownx.slugs.slugify
        kwds:
          case: lower
          normalize: NFKC
  - pymdownx.arithmatex:
      generic: true
  - pymdownx.betterem
  - pymdownx.details
  - pymdownx.magiclink
  - pymdownx.superfences
  - pymdownx.tilde

validation:
  nav:
    omitted_files: warn
    not_found: warn
  links:
    not_found: warn
    anchors: warn
